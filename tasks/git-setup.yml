- name: Ensure Git is installed
  ansible.builtin.pacman:
    name: 'git'
    state: present
  tags:
    - git

- name: Configure Git personal email
  git_config:
    name: user.email
    scope: global
    value: "azat@akmyradov.me"
  tags:
    - git

- name: Configure Git personal username
  git_config:
    name: user.name
    scope: global
    value: "Azat Akmyradov"
  tags:
    - git
