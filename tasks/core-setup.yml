# Block 1: Development Tools
- name: Install development tools (cmake, pkg-config, python3, lua, libtool, rust, go, ccache)
  become: true
  ansible.builtin.pacman:
    name:
      - cmake
      - pkg-config
      - python3
      - lua
      - libtool
      - rust
      - go
      - ccache
    state: present
  tags:
    - core
    - dev-tools

# Block 2: Utilities
- name: Install general utilities (unzip, wget, curl, htop, lsof, fzf, moreutils, jq, tldr)
  become: true
  ansible.builtin.pacman:
    name:
      - unzip
      - wget
      - curl
      - htop
      - lsof
      - fzf
      - moreutils
      - jq
      - tldr
    state: present
  tags:
    - core
    - utilities

# Block 3: Neovim
- name: Install Neovim
  become: true
  ansible.builtin.pacman:
    name: neovim
    state: present
  tags:
    - core
    - editor
