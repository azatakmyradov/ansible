- name: Install packages
  ansible.builtin.pacman:
    name:
      - "tmux"
      - "fzf"
      - "xclip"
      - "tldr"
      - "ripgrep"
      - "i3"
  tags:
    - productivity

- name: Create folders to store sources
  ansible.builtin.file:
    path: "{{ home }}/src"
    state: directory
    mode: '0755'
  tags:
    - sources

- name: Get application sources
  ansible.builtin.git:
    repo: https://aur.archlinux.org/{{ item }}.git
    dest: "{{ home }}/src/{{ item }}"
    version: master
  loop:
    - tableplus
    - google-chrome
  tags:
    - productivity
