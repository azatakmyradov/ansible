---
- name: Configure SSH keys and authorized_keys
  ansible.builtin.file:
    dest: "{{ dest_key | dirname }}"
    mode: '0700'
    state: directory
  tags:
    - ssh

- name: Copy SSH private key to remote host
  ansible.builtin.copy:
    src: "{{ source_key }}"
    dest: "{{ dest_key }}"
    mode: '0600'
  tags:
    - ssh

- name: Copy SSH public key to remote host
  ansible.builtin.copy:
    src: "{{ source_key }}.pub"
    dest: "{{ dest_key }}.pub"
    mode: '0644'
  tags:
    - ssh

- name: Add public keys to authorized_keys file
  authorized_key:
    user: "{{ user }}"
    state: present
    key: "{{ lookup('file', pub_key) }}"
  with_fileglob:
    - "{{ lookup('env', 'HOME') }}/.ssh/*.pub"
  tags:
    - ssh
